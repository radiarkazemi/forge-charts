# Short JSON cache for history (TradingView/Chartix pattern: first page is small
# and reused across TF switches / panes). Safe for /team/ and /dev/ — same payload.
# Include from http { }:
#   proxy_cache_path /var/cache/nginx/forge-hist levels=1:2 keys_zone=forge_hist:16m
#                    max_size=64m inactive=2m use_temp_path=off;
# Then inside location /tv-history, /crypto-chart/, /iran-gold/:
#   proxy_cache forge_hist;
#   proxy_cache_valid 200 8s;
#   proxy_cache_lock on;
#   add_header X-Forge-Hist-Cache $upstream_cache_status always;

proxy_cache_path /var/cache/nginx/forge-hist levels=1:2 keys_zone=forge_hist:16m
                 max_size=64m inactive=2m use_temp_path=off;
