# DEV-ONLY host (91.107.171.162). Do not use this file on forgechart.ir.
# Product stays at https://forgechart.ir/charts/
# Latest chart app is only /dev/ and /team/ here.

limit_req_zone $binary_remote_addr zone=forge_hist:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=forge_ws:10m;
proxy_cache_path /var/cache/nginx/forge_hist levels=1:2 keys_zone=forge_hist_cache:16m max_size=128m inactive=20m use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/forge-dev.crt;
    ssl_certificate_key /etc/nginx/ssl/forge-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/forge-web;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;

    # Serve the SPA. Do not force ?view=login — that used to wipe the session on refresh.
    location = / {
        return 302 /dev/;
    }

    location = /team { return 301 /team/; }
    location = /team/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /team/index.html =404;
    }
    location /team/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /team/index.html;
    }

    location = /charts { return 302 /dev/; }
    location = /charts/ { return 302 /dev/; }

    location = /dev {
        return 301 /dev/;
    }
    location = /dev/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    location = /dev/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    location ^~ /dev/landing/ {
        try_files $uri $uri/ /dev/landing/index.html;
    }
    location ^~ /dev/brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /dev/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /dev/index.html;
    }

    location ~ ^/assets/forge-dev/forge-main[^/]*\.js$ {
        root /var/www/forge-web;
        default_type application/javascript;
        gzip_static on;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /assets/forge-dev/ {
        root /var/www/forge-web;
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # App loads /charting_library/... (absolute). Licensed files already sit
    # under charts/charting_library/ on this host. Do not rewrite /charts/.
    location ^~ /charting_library/ {
        alias /var/www/forge-web/charts/charting_library/;
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /tv-history {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 8s;
        proxy_cache forge_hist_cache;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        add_header X-Forge-Hist-Cache $upstream_cache_status always;
        limit_req zone=forge_hist burst=20 nodelay;
    }

    location /crypto-chart/ {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_cache forge_hist_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        add_header X-Forge-Hist-Cache $upstream_cache_status always;
    }

    # Price API lives on the Falkenstein 2GB host (2.28.37.51). Talk to it
    # from this VPS — do not hairpin through forgechart.ir (Iran 499s).
    location /market-api/ {
        proxy_pass http://2.28.37.51:8088/api/v1/;
        proxy_set_header Host 2.28.37.51;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        include /etc/nginx/snippets/forge-market-api-key.conf;
    }

    location /crypto-api/ {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 30s;
    }

    location /crypto-ws {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host forgechart.ir;
        # Browser Origin is this IP host; Iran WS only allows forgechart.ir.
        proxy_set_header Origin https://forgechart.ir;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        limit_conn forge_ws 64;
    }

    # This host can reach Yahoo/Binance; forgechart.ir currently 502s Binance.
    location /api/yahoo/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 ForgeCharts";
        proxy_read_timeout 30s;
    }

    location /api/binance/ {
        proxy_pass https://api.binance.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_read_timeout 30s;
    }

    location /api/crypto/ {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 30s;
    }

    location /iran-gold/ {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 60s;
    }

    location /api/forge-profile {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
    }

    location /market-ticks {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host forgechart.ir;
        # Browser Origin is this IP host; Iran WS only allows forgechart.ir.
        proxy_set_header Origin https://forgechart.ir;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        limit_conn forge_ws 64;
    }
}
