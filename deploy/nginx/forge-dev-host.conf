# DEV host (91.107.171.162).
# forgechart.ir and www.forgechart.ir are the product. This machine forwards
# those two names to the product origin and never serves the dev app on them.
# The dev app is https://dev.forgechart.ir/dev/ and the raw IP /dev/ path.
# Product files stay at https://forgechart.ir/charts/ on the product origin.

limit_req_zone $binary_remote_addr zone=forge_hist:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=forge_ws:10m;
proxy_cache_path /var/cache/nginx/forge_hist levels=1:2 keys_zone=forge_hist_cache:16m max_size=128m inactive=20m use_temp_path=off;

# Pin the product origin. The public name also points at this dev machine,
# so a hostname proxy would loop back here.
upstream forge_product {
    server 185.222.0.116:443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.forgechart.ir forgechart.ir www.forgechart.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.forgechart.ir;
    include /etc/nginx/snippets/forge-dev-subdomain-ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/forge-web;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;

    include /etc/nginx/snippets/forge-dev-locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forgechart.ir www.forgechart.ir;
    include /etc/nginx/snippets/forge-dev-ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/forge-web;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;

    # While this address is in the domain's DNS, the chart has to load here.
    # Chart data still comes from the product origin. The dev subdomain is a
    # separate origin, so its saved charts do not mix with these two names.
    include /etc/nginx/snippets/forge-dev-locations.conf;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    include /etc/nginx/snippets/forge-dev-ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/forge-web;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;

    include /etc/nginx/snippets/forge-dev-locations.conf;
}
