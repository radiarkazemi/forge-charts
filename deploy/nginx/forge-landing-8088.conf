# Forge Charts — public landing + Supercharts on :8088
# Bare IP :8088 is Forge-only (Danora staging is :8092; Atrium is :8090).

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name 185.222.163.116 forge.185.222.163.116.sslip.io _;

    client_max_body_size 12m;
    sendfile on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml text/plain;

    root /var/www/forge-landing;
    index index.html;

    # Landing (Forge marketing)
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /brand/ {
        alias /var/www/forge-landing/brand/;
        access_log off;
        expires 7d;
    }

    location = /styles.css {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /main.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    # Supercharts app (same build as goldanil.ir/charts/)
    # Note: = /charts redirect comes from cp-fetcher-api.conf include.
    location /charts/ {
        root /var/www/anil/frontend/dist;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /charts/index.html;
    }

    # Hashed Forge / Anil assets (chart bundles under /assets/forge/)
    location /assets/ {
        root /var/www/anil/frontend/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # API used by live chart feeds (shared with Anil)
    include /etc/nginx/snippets/cp-fetcher-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
