# Forge Charts — landing + Supercharts on :8088 ONLY
# Danora is NOT served here (see danora.conf on :8092 + danoura.ir).
#
# Chart tree lives at /var/www/forge-web/{charts,assets/forge}
# so Forge is not coupled to Anil's site root.

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name 185.222.163.116 forge.185.222.163.116.sslip.io _;

    client_max_body_size 12m;
    sendfile on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml text/plain;

    root /var/www/forge-landing;
    index index.html;

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /brand/ {
        alias /var/www/forge-landing/brand/;
        access_log off;
        expires 7d;
    }

    location = /styles.css {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /main.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /i18n.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.html {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    # Dedicated Forge Supercharts (not Anil homepage).
    # Note: `location = /charts` redirect lives in cp-fetcher-api.conf.
    location /charts/ {
        root /var/www/forge-web;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /charts/index.html;
    }

    location /assets/forge/ {
        root /var/www/forge-web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/cp-fetcher-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
