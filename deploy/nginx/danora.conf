# Danora — hostname + dedicated staging port (NOT bare IP :8088).
# Forge Charts owns http://IP:8088/

upstream danora_next {
    server 127.0.0.1:3000;
    keepalive 8;
}

map $http_x_forwarded_proto $danora_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Direct staging on :8092
# :8088 = Forge landing, :8090 = Atrium, :8091 = reserved (other local service)
server {
    listen 8092;
    listen [::]:8092;
    server_name danora.185.222.163.116.sslip.io danoura.ir www.danoura.ir _;

    client_max_body_size 12m;
    sendfile off;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml text/plain;

    location /_next/static/ {
        alias /var/www/danora/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        alias /var/www/danora/public/icons/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location /probe/ {
        alias /var/www/danora/public/probe/;
        access_log off;
    }

    location = /favicon.ico {
        alias /var/www/danora/public/favicon.ico;
        access_log off;
        expires 7d;
    }

    location = /manifest.webmanifest {
        alias /var/www/danora/public/manifest.webmanifest;
        default_type application/manifest+json;
        access_log off;
    }

    location / {
        proxy_pass http://danora_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $danora_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
    }
}

# Port 80 — Danora hostnames only (Anil remains default_server for bare IP)
server {
    listen 80;
    listen [::]:80;
    server_name danoura.ir www.danoura.ir danora.185.222.163.116.sslip.io danora.2.28.37.51.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/danora/public;
