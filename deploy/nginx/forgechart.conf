# Forge Charts — public hostname forgechart.ir (and www)
# Keeps :8088 as the IP/port entry (see forge-landing-8088.conf).
# Danora stays on danoura.ir / :8092 — do not merge those hostnames here.
#
# Chart tree: /var/www/forge-web/{charts,assets/forge}
# Landing:    /var/www/forge-landing
#
# Cloudflare / origin notes:
# - Point A/AAAA (or Cloudflare orange-cloud) at 185.222.163.116
# - Prefer Cloudflare SSL mode Full (or Full Strict after Let's Encrypt)
# - HTTPS on origin prevents Host forgechart.ir from falling through to Anil

# Shared app locations are duplicated (not include'd) so this file stays self-contained.

# ---------- HTTP :80 ----------
server {
    listen 80;
    listen [::]:80;
    server_name forgechart.ir www.forgechart.ir;

    client_max_body_size 12m;
    sendfile on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml text/plain;

    # ACME / certbot webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/forge-landing;
        default_type text/plain;
        try_files $uri =404;
    }

    root /var/www/forge-landing;
    index index.html;

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /brand/ {
        alias /var/www/forge-landing/brand/;
        access_log off;
        expires 7d;
    }

    location = /styles.css {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /main.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /i18n.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.html {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location /charts/ {
        root /var/www/forge-web;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /charts/index.html;
    }

    location /assets/forge/ {
        root /var/www/forge-web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/cp-fetcher-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS :443 ----------
# Cert path: Let's Encrypt when issued; otherwise self-signed bootstrap
# at /etc/ssl/forgechart/{fullchain,privkey}.pem (created by deploy).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forgechart.ir www.forgechart.ir;

    ssl_certificate     /etc/ssl/forgechart/fullchain.pem;
    ssl_certificate_key /etc/ssl/forgechart/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    sendfile on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml text/plain;

    root /var/www/forge-landing;
    index index.html;

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /brand/ {
        alias /var/www/forge-landing/brand/;
        access_log off;
        expires 7d;
    }

    location = /styles.css {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /main.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /i18n.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.js {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location = /profile.html {
        root /var/www/forge-landing;
        add_header Cache-Control "no-cache" always;
    }

    location /charts/ {
        root /var/www/forge-web;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /charts/index.html;
    }

    location /assets/forge/ {
        root /var/www/forge-web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/cp-fetcher-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
