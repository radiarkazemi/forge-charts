# DEV-ONLY host (91.107.171.162). Do not use this file on forgechart.ir.
# Product stays at https://forgechart.ir/team/
# Latest chart app is only /dev/ here.

limit_req_zone $binary_remote_addr zone=forge_hist:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=forge_ws:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/forge-web;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /dev/;
    }

    # Previous product URL is NOT hosted here.
    location = /team { return 302 https://forgechart.ir/team/; }
    location /team/ { return 302 https://forgechart.ir/team/; }

    # Old custom-engine path from the mistaken deploy — send people to /dev/.
    location = /charts { return 302 /dev/; }
    location = /charts/ { return 302 /dev/; }

    location = /dev {
        return 301 /dev/;
    }
    location = /dev/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    location = /dev/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    location ^~ /dev/landing/ {
        try_files $uri $uri/ /dev/landing/index.html;
    }
    location ^~ /dev/brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /dev/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /dev/index.html;
    }

    location = /assets/forge-dev/forge-main.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files /assets/forge-dev/forge-main.js =404;
    }
    location /assets/forge-dev/ {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Header CSS + broker art still requested as /charts/... by the latest app.
    location = /charts/tv-header.css { try_files /charts/tv-header.css =404; }
    location = /charts/tv-header-mobile.css { try_files /charts/tv-header-mobile.css =404; }
    location = /charts/tv-header-secondary.css { try_files /charts/tv-header-secondary.css =404; }
    location ^~ /charts/brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /charting_library/ {
        proxy_pass https://forgechart.ir/charting_library/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 30s;
    }

    location /crypto-chart/ {
        limit_req zone=forge_hist burst=16 nodelay;
        proxy_pass https://forgechart.ir/crypto-chart/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 45s;
    }
    location /crypto-api/ {
        proxy_pass https://forgechart.ir/crypto-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /crypto-ws {
        limit_conn forge_ws 8;
        proxy_pass https://forgechart.ir/crypto-ws;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /market-api/ {
        proxy_pass https://forgechart.ir/market-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /api/ {
        proxy_pass https://forgechart.ir/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /tv-history {
        proxy_pass https://forgechart.ir/tv-history;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 45s;
    }
    location /iran-gold/ {
        proxy_pass https://forgechart.ir/iran-gold/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /market-ticks {
        proxy_pass https://forgechart.ir/market-ticks;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
