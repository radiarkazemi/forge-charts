# DEV-ONLY host (91.107.171.162). Do not use this file on forgechart.ir.
# Product stays at https://forgechart.ir/team/
# Latest chart app is only /dev/ here.
# Sign-up uses Web Crypto, so this host must be HTTPS. Do not turn that check off.

limit_req_zone $binary_remote_addr zone=forge_hist:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=forge_ws:10m;
proxy_cache_path /var/cache/nginx/forge_hist levels=1:2 keys_zone=forge_hist_cache:16m max_size=128m inactive=20m use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/forge-dev.crt;
    ssl_certificate_key /etc/nginx/ssl/forge-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/forge-web;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /dev/?view=login;
    }

    # Previous product URL is NOT hosted here.
    location = /team { return 302 https://forgechart.ir/team/; }
    location /team/ { return 302 https://forgechart.ir/team/; }

    # Old custom-engine path from the mistaken deploy — send people to /dev/.
    location = /charts { return 302 /dev/?view=login; }
    location = /charts/ { return 302 /dev/?view=login; }

    location = /dev {
        return 301 /dev/?view=login;
    }
    location = /dev/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    # Bare /dev/ used to bounce to the landing page. Open the chart sign-in instead.
    location = /dev/ {
        if ($arg_view = "") {
            return 302 /dev/?view=login;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /dev/index.html =404;
    }
    location ^~ /dev/landing/ {
        try_files $uri $uri/ /dev/landing/index.html;
    }
    location ^~ /dev/brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /dev/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /dev/index.html;
    }

    location = /assets/forge-dev/forge-main.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files /assets/forge-dev/forge-main.js =404;
    }
    location /assets/forge-dev/ {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Header CSS + broker art still requested as /charts/... by the latest app.
    location = /charts/tv-header.css { try_files /charts/tv-header.css =404; }
    location = /charts/tv-header-mobile.css { try_files /charts/tv-header-mobile.css =404; }
    location = /charts/tv-header-secondary.css { try_files /charts/tv-header-secondary.css =404; }
    location ^~ /charts/brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Served from disk after a one-time copy. Proxying each bundle via forgechart.ir
    # made the first chart paint wait on a Germany↔Iran round trip.
    location ^~ /charting_library/ {
        root /var/www/forge-web/charts;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        gzip_static on;
        try_files $uri @charting_library_proxy;
    }
    location @charting_library_proxy {
        proxy_pass https://forgechart.ir;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 30s;
    }

    location /crypto-chart/ {
        limit_req zone=forge_hist burst=16 nodelay;
        proxy_cache forge_hist_cache;
        proxy_cache_valid 200 12s;
        proxy_cache_use_stale error timeout updating http_502;
        proxy_pass https://forgechart.ir/crypto-chart/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /crypto-api/ {
        proxy_pass https://forgechart.ir/crypto-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /crypto-ws {
        limit_conn forge_ws 8;
        proxy_pass https://forgechart.ir/crypto-ws;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /market-api/ {
        proxy_pass https://forgechart.ir/market-api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /api/ {
        proxy_pass https://forgechart.ir/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /tv-history {
        proxy_pass https://forgechart.ir/tv-history;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 45s;
    }
    location /iran-gold/ {
        proxy_pass https://forgechart.ir/iran-gold/;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_read_timeout 20s;
    }
    location /market-ticks {
        proxy_pass https://forgechart.ir/market-ticks;
        proxy_ssl_server_name on;
        proxy_set_header Host forgechart.ir;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
