# Document security headers for forgechart.ir.
# Included from every location that sets its own add_header, because nginx
# does not inherit add_header into those locations.
# HSTS is modest and has no preload and no includeSubDomains so the
# direct HTTP chart port can keep working from networks that cannot
# reach the HTTPS proxy.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://stream.binance.com:9443 https://stream.binance.com:9443 wss://data-stream.binance.vision https://data-stream.binance.vision https://accounts.google.com https://oauth2.googleapis.com https://www.recaptcha.net; worker-src 'self' blob:; frame-src 'self' blob:" always;
