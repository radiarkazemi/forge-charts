# Shared by the IP host and https://dev.forgechart.ir only.
# forgechart.ir and www.forgechart.ir never include this file.

location = / {
    return 302 /dev/;
}

location = /team { return 301 /team/; }
location = /team/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://stream.binance.com:9443 https://stream.binance.com:9443 wss://data-stream.binance.vision https://data-stream.binance.vision https://accounts.google.com https://oauth2.googleapis.com https://www.recaptcha.net; worker-src 'self' blob:; frame-src 'self' blob:" always;
    try_files /team/index.html =404;
}
location /team/ {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /team/index.html;
}

location = /charts { return 302 /dev/; }
location = /charts/ { return 302 /dev/; }

location = /dev {
    return 301 /dev/;
}
location = /dev/index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://stream.binance.com:9443 https://stream.binance.com:9443 wss://data-stream.binance.vision https://data-stream.binance.vision https://accounts.google.com https://oauth2.googleapis.com https://www.recaptcha.net; worker-src 'self' blob:; frame-src 'self' blob:" always;
    try_files /dev/index.html =404;
}
location = /dev/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://stream.binance.com:9443 https://stream.binance.com:9443 wss://data-stream.binance.vision https://data-stream.binance.vision https://accounts.google.com https://oauth2.googleapis.com https://www.recaptcha.net; worker-src 'self' blob:; frame-src 'self' blob:" always;
    try_files /dev/index.html =404;
}
location ^~ /dev/landing/ {
    try_files $uri $uri/ /dev/landing/index.html;
}
location ^~ /dev/brand/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
}
location /dev/ {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /dev/index.html;
}

location ~ ^/assets/forge-dev/forge-main[^/]*\.js$ {
    root /var/www/forge-web;
    default_type application/javascript;
    gzip_static on;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location /assets/forge-dev/ {
    root /var/www/forge-web;
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# App loads /charting_library/... (absolute). Licensed files already sit
# under charts/charting_library/ on this host. Do not rewrite /charts/.
location ^~ /charting_library/ {
    alias /var/www/forge-web/charts/charting_library/;
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
}

location /tv-history {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_cache forge_hist_cache;
    proxy_cache_valid 200 15s;
    proxy_cache_lock on;
    add_header X-Forge-Hist-Cache $upstream_cache_status always;
    limit_req zone=forge_hist burst=20 nodelay;
}

location /crypto-chart/ {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_cache forge_hist_cache;
    proxy_cache_valid 200 10s;
    proxy_cache_lock on;
    add_header X-Forge-Hist-Cache $upstream_cache_status always;
}

# Price API lives on the Falkenstein 2GB host (2.28.37.51). Talk to it
# from this VPS — do not hairpin through forgechart.ir (Iran 499s).
location /market-api/ {
    proxy_pass http://2.28.37.51:8088/api/v1/;
    proxy_set_header Host 2.28.37.51;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    include /etc/nginx/snippets/forge-market-api-key.conf;
}

location /crypto-api/ {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
    proxy_read_timeout 30s;
}

location /crypto-ws {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_http_version 1.1;
    proxy_set_header Host forgechart.ir;
    # Browser Origin is this dev host; the product socket only allows forgechart.ir.
    proxy_set_header Origin https://forgechart.ir;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    limit_conn forge_ws 64;
}

# This host can reach Yahoo/Binance; forgechart.ir currently 502s Binance.
location /api/yahoo/ {
    proxy_pass https://query1.finance.yahoo.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host query1.finance.yahoo.com;
    proxy_set_header User-Agent "Mozilla/5.0 ForgeCharts";
    proxy_read_timeout 30s;
}

location /api/binance/ {
    proxy_pass https://api.binance.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.binance.com;
    proxy_read_timeout 30s;
}

location /api/crypto/ {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
    proxy_read_timeout 30s;
}

location /iran-gold/ {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
    proxy_read_timeout 60s;
}

location /api/forge-profile {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_set_header Host forgechart.ir;
}

location /market-ticks {
    proxy_pass https://forge_product;
    proxy_ssl_server_name on;
    proxy_ssl_name forgechart.ir;
    proxy_connect_timeout 8s;
    proxy_http_version 1.1;
    proxy_set_header Host forgechart.ir;
    # Browser Origin is this dev host; the product socket only allows forgechart.ir.
    proxy_set_header Origin https://forgechart.ir;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    limit_conn forge_ws 64;
}
