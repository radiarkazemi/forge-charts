# Development chart app.
# The normal Forge sign-in is enough. Do not add a browser password dialog.
# /team/ is that sign-in. /dev/ redirects there.
# Scripts, pictures, and header CSS are shared by /team/.

location = /dev {
    return 301 /team/;
}
location = /dev/index.html {
    return 301 /team/;
}
location = /dev/ {
    return 301 /team/;
}
location ^~ /dev/brand/ {
    root /var/www/forge-web;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
}
location = /dev/tv-header.css {
    root /var/www/forge-web;
    try_files /dev/tv-header.css =404;
}
location = /dev/tv-header-mobile.css {
    root /var/www/forge-web;
    try_files /dev/tv-header-mobile.css =404;
}
location = /dev/tv-header-secondary.css {
    root /var/www/forge-web;
    try_files /dev/tv-header-secondary.css =404;
}
location /dev/ {
    rewrite ^/dev/(.*)$ /team/$1 permanent;
}

location = /team {
    return 301 /team/;
}
# Own index file. Do not fall through to /dev/index.html — that location asks for the server password.
location /team/ {
    root /var/www/forge-web;
    try_files $uri $uri/ /team/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/snippets/forge-security-headers.conf;
    etag off;
    if_modified_since off;
}

location ~ ^/assets/forge-dev/forge-main[^/]*\.js$ {
    root /var/www/forge-web;
    default_type application/javascript;
    gzip_static on;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location /assets/forge-dev/ {
    root /var/www/forge-web;
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
