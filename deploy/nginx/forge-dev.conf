# Development chart app.
# /dev/ stays behind the server password.
# /team/ is the same build with the normal account login (no password dialog).
# Scripts, pictures, and header CSS are shared by /team/ and must load without that dialog.

location = /dev {
    auth_basic "Forge development";
    auth_basic_user_file /etc/nginx/forge-dev.htpasswd;
    return 301 /dev/;
}
location = /dev/index.html {
    auth_basic "Forge development";
    auth_basic_user_file /etc/nginx/forge-dev.htpasswd;
    root /var/www/forge-web;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/snippets/forge-security-headers.conf;
    etag off;
    if_modified_since off;
}
location = /dev/ {
    auth_basic "Forge development";
    auth_basic_user_file /etc/nginx/forge-dev.htpasswd;
    root /var/www/forge-web;
    try_files /dev/index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/snippets/forge-security-headers.conf;
    etag off;
    if_modified_since off;
}
location ^~ /dev/brand/ {
    root /var/www/forge-web;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
}
location = /dev/tv-header.css {
    root /var/www/forge-web;
    try_files /dev/tv-header.css =404;
}
location = /dev/tv-header-mobile.css {
    root /var/www/forge-web;
    try_files /dev/tv-header-mobile.css =404;
}
location = /dev/tv-header-secondary.css {
    root /var/www/forge-web;
    try_files /dev/tv-header-secondary.css =404;
}
location /dev/ {
    auth_basic "Forge development";
    auth_basic_user_file /etc/nginx/forge-dev.htpasswd;
    root /var/www/forge-web;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/forge-security-headers.conf;
    try_files $uri $uri/ /dev/index.html;
}

location = /team {
    return 301 /team/;
}
# Own index file. Do not fall through to /dev/index.html — that location asks for the server password.
location /team/ {
    root /var/www/forge-web;
    try_files $uri $uri/ /team/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/snippets/forge-security-headers.conf;
    etag off;
    if_modified_since off;
}

location = /assets/forge-dev/forge-main.js {
    root /var/www/forge-web;
    default_type application/javascript;
    expires -1;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /assets/forge-dev/forge-main.js =404;
}
location /assets/forge-dev/ {
    root /var/www/forge-web;
    expires -1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
