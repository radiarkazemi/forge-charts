# Forge Charts — 2 CPU / 4 GB. Copy to /etc/nginx/sites-available/forge-charts
# Set CHART_UPSTREAM in /etc/nginx/conf.d/forge-upstream.conf if history lives on another host.

limit_req_zone $binary_remote_addr zone=forge_hist:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=forge_ws:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/forge-charts;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    open_file_cache max=256 inactive=60s;

    location = /charts {
        return 301 /charts/;
    }
    location /charts/ {
        alias /var/www/forge-charts/;
        try_files $uri $uri/ /charts/index.html;
    }
    location /assets/forge/ {
        alias /var/www/forge-charts/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /crypto-chart/ {
        limit_req zone=forge_hist burst=16 nodelay;
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location /crypto-ws {
        limit_conn forge_ws 8;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /crypto-api/ {
        # Quotes / verbose history: local cp_fetcher or remote upstream.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location /yahoo/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 ForgeCharts";
    }
    location /binance/ {
        proxy_pass https://data-api.binance.vision/;
        proxy_ssl_server_name on;
        proxy_set_header Host data-api.binance.vision;
    }
}
