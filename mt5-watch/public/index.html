<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MT5 Watch — TRH · ICT · CRT</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --line: #2a3340;
      --text: #e7ecf3;
      --muted: #8b97a8;
      --trh: #3d9cf0;
      --ict: #e0b44e;
      --crt: #46c39b;
      --good: #3dd68c;
      --bad: #f07178;
      --warn: #e6c07b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2330 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #14201c 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: baseline;
      justify-content: space-between;
      padding: 20px 28px 8px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.45rem;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--muted); font-weight: 400; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .goal {
      margin: 16px 28px 0;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
    }
    .goal.done { border-color: #2f6f4e; background: #122019; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 0.8rem;
    }
    .pill.on { border-color: #2f6f4e; color: var(--good); }
    .pill.off { color: var(--muted); }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.live { background: var(--good); box-shadow: 0 0 0 3px rgba(61,214,140,.15); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 16px 28px;
    }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px 18px;
      min-height: 220px;
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card.trh h2 { color: var(--trh); }
    .card.ict h2 { color: var(--ict); }
    .card.crt h2 { color: var(--crt); }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 10px;
      font-size: 0.92rem;
    }
    .kv b { color: var(--muted); font-weight: 500; }
    .long { color: var(--good); }
    .short { color: var(--bad); }
    .feed {
      margin: 0 28px 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .feed h3 {
      margin: 0;
      padding: 12px 16px;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--line);
    }
    .feed ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 420px;
      overflow: auto;
    }
    .feed li {
      padding: 10px 16px;
      border-bottom: 1px solid #1e2630;
      font-size: 0.86rem;
      display: grid;
      grid-template-columns: 74px 52px 64px 1fr;
      gap: 10px;
      align-items: start;
    }
    .feed li:last-child { border-bottom: 0; }
    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #222a35;
      color: var(--muted);
      width: fit-content;
    }
    .tag.setup { background: #243528; color: var(--good); }
    .tag.heartbeat { opacity: 0.55; }
    .tag.TRH { color: var(--trh); }
    .tag.ICT { color: var(--ict); }
    .tag.CRT { color: var(--crt); }
    .msg { color: var(--text); word-break: break-word; }
    .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>MT5 Watch <span>TRH · ICT · CRT live bridge</span></h1>
    <div class="meta" id="conn">connecting…</div>
  </header>

  <div class="goal" id="goal">
    <strong>Watch goal:</strong>
    <span class="pill off" id="g-trh"><span class="dot" id="d-trh"></span>TRH setup</span>
    <span class="pill off" id="g-ict"><span class="dot" id="d-ict"></span>ICT setup</span>
    <span class="pill off" id="g-crt"><span class="dot" id="d-crt"></span>CRT setup</span>
    <span class="meta" id="goal-txt">waiting for all 3 models to print ≥1 setup</span>
  </div>

  <section class="grid" id="cards"></section>

  <section class="feed">
    <h3>Live event feed</h3>
    <ul id="feed"></ul>
  </section>

  <script>
    const MODELS = ["TRH", "ICT", "CRT"];
    const cards = document.getElementById("cards");
    const feed = document.getElementById("feed");
    const conn = document.getElementById("conn");

    function fmt(n) {
      if (n == null || Number.isNaN(n) || n === 0) return "—";
      return Number(n).toFixed(2);
    }
    function ago(ms) {
      if (!ms) return "never";
      const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      return Math.floor(s / 3600) + "h ago";
    }
    function sideClass(side) {
      if (side === "LONG") return "long";
      if (side === "SHORT") return "short";
      return "";
    }

    function renderCards(models) {
      cards.innerHTML = MODELS.map((name) => {
        const m = models[name] || {};
        const live = !!m.online;
        return `<article class="card ${name.toLowerCase()}">
          <h2>${name} <span class="pill ${live ? "on" : "off"}"><span class="dot ${live ? "live" : ""}"></span>${live ? "live" : "offline"}</span></h2>
          <div class="sub">${m.symbol || "—"} ${m.tf || ""} · seen ${ago(m.lastSeenAt)} · setups ${m.setupsSeen || 0}</div>
          <div class="kv">
            <b>Status</b><span>${m.status || "—"}</span>
            <b>Side</b><span class="${sideClass(m.side)}">${m.side || "—"} ${m.mode ? "· " + m.mode : ""}</span>
            <b>Entry</b><span>${fmt(m.entry)}</span>
            <b>SL</b><span>${fmt(m.sl)}</span>
            <b>TP</b><span>${fmt(m.tp)}</span>
            <b>Note</b><span>${m.message || "—"}</span>
          </div>
        </article>`;
      }).join("");
    }

    function renderGoal(need, allHaveSetup) {
      for (const n of need) {
        const el = document.getElementById("g-" + n.model.toLowerCase());
        const dot = document.getElementById("d-" + n.model.toLowerCase());
        el.className = "pill " + (n.hasSetup ? "on" : "off");
        dot.className = "dot " + (n.hasSetup ? "live" : "");
      }
      const goal = document.getElementById("goal");
      const txt = document.getElementById("goal-txt");
      if (allHaveSetup) {
        goal.classList.add("done");
        txt.textContent = "all 3 models have printed at least one setup";
      } else {
        goal.classList.remove("done");
        const missing = need.filter((n) => !n.hasSetup).map((n) => n.model).join(", ");
        txt.textContent = "still waiting: " + missing;
      }
    }

    function pushFeed(ev) {
      if (!ev || ev.kind === "heartbeat") return;
      const li = document.createElement("li");
      const t = new Date(ev.recvAt || ev.ts || Date.now());
      li.innerHTML = `<span class="time">${t.toLocaleTimeString()}</span>
        <span class="tag ${ev.model}">${ev.model}</span>
        <span class="tag ${ev.kind}">${ev.kind}</span>
        <span class="msg">${ev.message || (ev.side + " " + ev.status + " E " + fmt(ev.entry))}</span>`;
      feed.prepend(li);
      while (feed.children.length > 80) feed.removeChild(feed.lastChild);
    }

    function applySnapshot(snap) {
      renderCards(snap.models || {});
      renderGoal(snap.need || [], !!snap.allHaveSetup);
      conn.textContent = "live · " + new Date(snap.serverTime).toLocaleTimeString();
    }

    async function boot() {
      const r = await fetch("/api/snapshot");
      const snap = await r.json();
      applySnapshot(snap);
      (snap.events || []).slice(-40).forEach(pushFeed);
    }

    function connectSse() {
      const es = new EventSource("/api/stream");
      es.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          if (data.type === "hello" || data.type === "tick") applySnapshot(data.snapshot || data);
          if (data.type === "event") {
            applySnapshot({ models: data.models, need: MODELS.map((m) => ({
              model: m,
              hasSetup: (data.models?.[m]?.setupsSeen || 0) > 0,
            })), allHaveSetup: MODELS.every((m) => (data.models?.[m]?.setupsSeen || 0) > 0), serverTime: Date.now() });
            pushFeed(data.event);
          }
        } catch {}
      };
      es.onerror = () => {
        conn.textContent = "reconnecting…";
      };
    }

    boot().then(connectSse).catch((e) => {
      conn.textContent = "error: " + e.message;
    });
  </script>
</body>
</html>
