<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRH Alerts</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #26a69a;
      --warn: #ef5350;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #243040;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: var(--accent);
    }
    .sub { margin-top: 4px; color: var(--muted); font-size: 11px; }
    main { padding: 12px 16px 16px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
    }
    .label { color: var(--muted); }
    .val { font-variant-numeric: tabular-nums; }
    .card {
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .side { font-weight: 700; color: var(--accent); }
    .side.short { color: var(--warn); }
    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--accent);
      color: #04120f;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .err { color: var(--warn); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>TRH | Trading Room Hunter</h1>
    <div class="sub">Classic SWEEP · FOREXCOM via VPS</div>
  </header>
  <main>
    <div class="row"><span class="label">Status</span><span class="val" id="status">…</span></div>
    <div class="row"><span class="label">Feed</span><span class="val" id="feed">FOREXCOM</span></div>
    <div class="row"><span class="label">Last price</span><span class="val" id="price">—</span></div>
    <div class="row"><span class="label">Last scan</span><span class="val" id="scan">—</span></div>

    <div class="card" id="setupCard">
      <div class="side" id="side">No setup yet</div>
      <div class="row"><span class="label">ENTRY</span><span class="val" id="entry">—</span></div>
      <div class="row"><span class="label">SL</span><span class="val" id="sl">—</span></div>
      <div class="row"><span class="label">TP</span><span class="val" id="tp">—</span></div>
    </div>
    <div class="err" id="err" hidden></div>
    <button id="scanBtn" type="button">Scan now</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
