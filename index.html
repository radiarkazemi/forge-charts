<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Forge Charts</title>
    <!--
      Do NOT load fonts.googleapis.com / fonts.gstatic.com here.
      Many IR networks block Google; preconnect+stylesheet stalls boot for those
      users while VPN users (and this agent) see a healthy chart.
      UI falls back to Trebuchet / system sans from theme tokens.
    -->
    <script>
      // Surface boot failures (stale cache, mid-deploy 404, or CF/ISP connection reset)
      // instead of a blank page. IR networks often RST Cloudflare; origin :8088 bypasses CF.
      (function () {
        var ORIGIN_FALLBACK =
          typeof window.__FORGE_ORIGIN_FALLBACK__ === "string"
            ? window.__FORGE_ORIGIN_FALLBACK__
            : "";
        function showBootError(detail) {
          var root = document.getElementById("root");
          if (!root || root.dataset.bootErr) return;
          root.dataset.bootErr = "1";
          var fallback = ORIGIN_FALLBACK
            ? "<p style='margin:10px 0 0;color:#9aa0a6'>If the browser said <em>connection was reset</em>, open the direct (non-Cloudflare) chart: <a style='color:#7ec8ff' href='" +
              ORIGIN_FALLBACK +
              "'>" +
              ORIGIN_FALLBACK +
              "</a> or use a VPN, then retry forgechart.ir.</p>"
            : "<p style='margin:10px 0 0;color:#9aa0a6'>If the browser said <em>connection was reset</em>, use a VPN or the server HTTP fallback on port 8088 (<code>/charts/</code>), then retry forgechart.ir.</p>";
          root.innerHTML =
            '<div style="font:14px/1.45 system-ui,sans-serif;padding:24px;max-width:440px;margin:10vh auto;color:#e8eaed;background:#12141a;border:1px solid #2a2e39;border-radius:8px">' +
            "<strong>Forge Chart failed to load.</strong>" +
            "<p style='margin:10px 0 0;color:#9aa0a6'>Hard-refresh (Ctrl+Shift+R). " +
            (detail ? detail + " " : "") +
            "</p>" +
            fallback +
            "</div>";
        }
        window.addEventListener(
          "error",
          function (ev) {
            try {
              var src = (ev && (ev.filename || (ev.target && ev.target.src))) || "";
              if (
                !src ||
                (src.indexOf("/assets/forge/") === -1 &&
                  src.indexOf("/charting_library/") === -1)
              ) {
                return;
              }
              showBootError("");
            } catch (_) {
              /* ignore */
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
