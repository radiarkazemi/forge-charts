<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Forge Charts</title>
    <script>
      // Login must not download the 2.5MB Charting Library. Chart routes preload it.
      (function () {
        try {
          if (new URLSearchParams(location.search).get("view") === "login") return;
        } catch (e) {}
        [
          "/charting_library/charting_library.js",
          "/charting_library/bundles/runtime.528f81f7a425983444d8.js",
          "/charting_library/bundles/library.2a35263e52ab75f5729a.js",
        ].forEach(function (href) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "script";
          l.href = href;
          document.head.appendChild(l);
        });
      })();
    </script>
    <!--
      Do NOT load fonts.googleapis.com / fonts.gstatic.com here.
      Many IR networks block Google; preconnect+stylesheet stalls boot for those
      users while VPN users (and this agent) see a healthy chart.
      UI falls back to Trebuchet / system sans from theme tokens.
    -->
    <script>
      // Surface hashed-bundle load failures (stale cache / mid-deploy 404) instead of a blank page.
      window.addEventListener(
        "error",
        function (ev) {
          try {
            // Script-tag load failures only. Runtime errors must not wipe the page.
            // Match /assets/forge/forge-main.js, not /assets/forge-dev/ (substring trap).
            var t = ev && ev.target;
            if (!t || t.tagName !== "SCRIPT") return;
            var src = String(t.src || "");
            if (!/\/assets\/forge(?:-dev)?\/forge-main\.js(?:\?|$)/.test(src)) return;
            var root = document.getElementById("root");
            if (!root || root.dataset.bootErr) return;
            root.dataset.bootErr = "1";
            root.innerHTML =
              '<div style="font:14px/1.45 system-ui,sans-serif;padding:24px;max-width:420px;margin:10vh auto;color:#e8eaed;background:#12141a;border:1px solid #2a2e39;border-radius:8px">' +
              "<strong>Forge Chart failed to load.</strong>" +
              "<p style='margin:10px 0 0;color:#9aa0a6'>Hard-refresh this page (Ctrl+Shift+R / clear cache). If it still fails, open forgechart.ir/charts/ directly.</p>" +
              "</div>";
          } catch (_) {
            /* ignore */
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
